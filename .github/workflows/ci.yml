# Continuous integration.
#
#   check  every pull request and every push to main: lint, type checks and tests
#          (the same `make check` run locally).
#   image  builds the flights watcher image. On pull requests it only builds it
#          (amd64) to prove the Dockerfile works; on main it builds it for amd64
#          (laptops) and arm64 (the Oracle Cloud server) and pushes it to GHCR.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run for the same branch or PR cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/borjaviadero/flights-watcher

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install Python and dependencies (from uv.lock)
        run: uv sync --frozen

      - name: make check
        run: make check

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR with the built-in GITHUB_TOKEN
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (to build arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: watchers/flights/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
