#cloud-config
# First-boot setup of the server (runs once, when the VM is created).
# Kubernetes (k3s) is installed in Phase 4.

package_update: true
package_upgrade: true

packages:
  - unattended-upgrades # security updates installed automatically

timezone: Etc/UTC # servers keep UTC; schedules set their own time zone

# 2 GB of swap on disk: headroom for k3s on the 1 GB micro server (harmless on ARM).
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

ssh_pwauth: false # keys only, never passwords
