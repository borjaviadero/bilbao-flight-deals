[project]
name = "dealhunter-core"
version = "0.1.0"
description = "Shared logic for deal watchers: configuration, price history, deal rules and notifications."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealhunter_core"]
