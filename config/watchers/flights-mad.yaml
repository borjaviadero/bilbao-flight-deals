# Flights watcher instance: LONG-HAUL departures from Madrid (MAD).
#
# Why long haul only: from Bilbao, getting to Madrid costs about 30-60 € per person and
# half a day each way. On European routes a deal saves less than that (and flights-bio
# already covers Europe); on long-haul routes a 30 % drop saves hundreds of euros.
# Madrid: Iberia's hub to Latin America.

watcher: flights
instance: flights-mad
enabled: true

schedule: "0 9,21 * * *"       # 09:00 and 21:00, Europe/Madrid (cron)

search:
  origin: MAD
  destinations: any
  trip: round_trip
  passengers: 2
  currency: EUR
  min_distance_km: 4500        # long haul only: at least 4,500 km away (~6 h direct)
                               # e.g. New York ~5,800 · Dubai ~5,600 · Mexico City ~9,000;
                               # leaves out Europe, North Africa, Egypt, Armenia...
                               # (flight time is not used: with a stop it includes the layover)
  exclude_countries: [ES]      # international only
  trip_length:
    - min_nights: 7            # at least a week; at most three
      max_nights: 21
  max_stops: 1                 # direct or 1 stop on each leg
  usual_price_by: route_month  # long-haul prices are seasonal: compare within the same month
  city_names:                  # override names from the data file ("Ciudad de ...")
    MAD: Madrid

# No fixed euro caps: a long-haul round trip never costs 40 € per person, so only the
# drop against the usual price (same route, same departure month) decides.
deal_windows:
  - name: regular
    label:
      en: "🌍 Long-haul deal"
      es: "🌍 Chollo largo radio"
    min_days_ahead: 30
    max_days_ahead: 180
    match: any
    rules:
      - type: drop_vs_usual
        min_drop_percent: 30
        lookback_days: 30
        min_observations: 5

  - name: last_minute          # only exceptional prices (including fare errors)
    label:
      en: "⚡ Long-haul super deal · last minute"
      es: "⚡ Superprecio largo radio · última hora"
    min_days_ahead: 7
    max_days_ahead: 29
    match: any
    rules:
      - type: drop_vs_usual
        min_drop_percent: 50
        lookback_days: 30
        min_observations: 5

# Super deals: the best deals, posted to the group's General topic INSTEAD of this topic.
# Long haul: the percentage matters; the saving must clearly beat the trip from Bilbao.
# A fixed euro threshold (e.g. cents per km) is left until the trial gives real data.
super_deals:
  label:
    en: "🔥 Long-haul super deal"
    es: "🔥 Superchollo largo radio"
  min_drop_percent: 50         # at least 50 % below usual (same route and month)...
  min_saving_per_person: 150   # ...and at least 150 € saved per person
  min_observations: 10         # usual price backed by at least 10 prices (deals need 5)
  max_detour_factor: 1.75      # with a stop, each leg <= 1.75 x the direct flight time
                               # (e.g. Madrid-New York: ~8 h direct, so at most ~13.5 h)
  topic_id_env: null           # null = the group's General topic

alerts:
  repeat_only_if_lower: true
  max_per_run: 20
  warmup_first_run: true
  weekly_summary: sunday

telegram:
  group: flights
  topic: madrid
  chat_id_env: TELEGRAM_FLIGHTS_CHAT_ID
  topic_id_env: TELEGRAM_FLIGHTS_MAD_TOPIC_ID
  language: es
