# Flights watcher instance: departures from Bilbao.
# To watch another airport, copy this file and change `instance`, `origin`,
# `telegram.topic` and `telegram.topic_id_env`.

watcher: flights
instance: flights-bio
enabled: true

schedule: "0 */6 * * *"        # every 6 hours (cron)

search:
  origin: BIO                  # Bilbao airport (IATA code)
  destinations: any
  trip: round_trip
  passengers: 2
  currency: EUR
  trip_length:                 # nights allowed, by outbound flight time (a proxy for distance)
    - max_flight_hours: 3      # e.g. Milan, Valencia, London
      min_nights: 2
      max_nights: 7
    - max_flight_hours: 6      # e.g. Canary Islands, Greece, Morocco
      min_nights: 3
      max_nights: 10
    - min_nights: 6            # longer flights, e.g. Mexico, New York
      max_nights: 21
  max_stops: 1                 # direct or 1 stop on each leg (e.g. BIO → DUB → HER)
  # Layover duration and separate-ticket detection are not available from the
  # current price source, so they are not configurable (see docs/price-source.md).

# Each window covers a range of departure dates and has its own deal rules.
# Prices from the API are per adult; per-person rules compare against that price.
deal_windows:
  - name: regular              # enough time to book days off
    label:                     # alert title, per language
      en: "✈️ Deal"
      es: "✈️ Chollo"
    min_days_ahead: 30
    max_days_ahead: 180        # ~6 months
    match: any                 # alert if ANY rule matches
    rules:
      - type: drop_vs_usual
        min_drop_percent: 30
        lookback_days: 30      # usual price = median of the last 30 days for the route
        min_observations: 5    # fewer prices seen → this rule does not apply yet
      - type: max_price_per_person
        amount: 40

  - name: last_minute          # short notice: only exceptional prices
    label:
      en: "⚡ Super deal · last minute"
      es: "⚡ Superprecio · última hora"
    min_days_ahead: 7
    max_days_ahead: 29
    match: any
    rules:
      - type: drop_vs_usual
        min_drop_percent: 50
        lookback_days: 30
        min_observations: 5
      - type: max_price_per_person
        amount: 30

alerts:
  repeat_only_if_lower: true   # don't re-alert the same flight unless the price drops further
  max_per_run: 5               # best 5 deals as alerts; the rest in one summary message
  warmup_first_run: true       # first run: record prices, send only a "watching" message
  weekly_summary: sunday

telegram:
  # Where alerts are posted. IDs are deployment-specific, so they are read from
  # environment variables (see .env.example) instead of being stored here.
  group: flights                                 # group for flight deals
  topic: bilbao                                  # topic for departures from Bilbao
  chat_id_env: TELEGRAM_FLIGHTS_CHAT_ID          # env var holding the group chat ID
  topic_id_env: TELEGRAM_FLIGHTS_BIO_TOPIC_ID    # env var holding the topic (thread) ID
  language: es                                   # language of the messages (en or es)
