[project]
name = "flights-watcher"
version = "0.1.0"
description = "Watcher that looks for round-trip flight deals and reports them through dealhunter-core."
requires-python = ">=3.13"
dependencies = [
    "dealhunter-core",
]

[tool.uv.sources]
dealhunter-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flights_watcher"]
